services:
  - type: web
    name: sierra-madre-checkin
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        value: "https://onrender.com"
      - key: RESERVATIONS_URL
        sync: false
      - key: BANK_URL
        sync: false
      - key: CABIN_AVAILABILITY_URL
        sync: false
      - key: CABIN_CHECKOUT_URL
        sync: false
